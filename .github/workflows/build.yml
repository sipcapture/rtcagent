name: RTCAgent Builder

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Setup Build Env
      run: bash builder/init_env.sh

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Install syft
      uses: anchore/sbom-action/download-syft@v0

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attest build provenance
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: |
          dist/**/rtcagent
          dist/**/rtcagent-arm64
          dist/rtcagent_*.deb
          dist/rtcagent_*.rpm

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker Build and push
      id: docker
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          RTCAGENT_VERSION=${{ github.ref_name }}
        tags: |
           ghcr.io/sipcapture/rtcagent:latest
           ghcr.io/sipcapture/rtcagent:${{ github.ref_name }}

    - name: Sign the container image (keyless)
      run: cosign sign --yes ghcr.io/sipcapture/rtcagent@${{ steps.docker.outputs.digest }}