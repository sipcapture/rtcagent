name: RTCAgent Builder

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        check-latest: true

    - name: Setup Build Env
      run: bash builder/init_env.sh

    - name: Install cosign
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

    - name: Install syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
      with:
        distribution: goreleaser
        version: "~> v2"
        args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attest build provenance
      if: github.event_name == 'release'
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-path: |
          dist/**/rtcagent
          dist/**/rtcagent-arm64
          dist/rtcagent_*.deb
          dist/rtcagent_*.rpm

    - name: Set up QEMU
      if: github.event_name == 'release'
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      if: github.event_name == 'release'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to the Container registry
      if: github.event_name == 'release'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker Build and push
      if: github.event_name == 'release'
      id: docker
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          RTCAGENT_VERSION=${{ github.ref_name }}
        tags: |
           ghcr.io/sipcapture/rtcagent:latest
           ghcr.io/sipcapture/rtcagent:${{ github.ref_name }}

    - name: Sign the container image (keyless)
      if: github.event_name == 'release'
      run: cosign sign --yes ghcr.io/sipcapture/rtcagent@${{ steps.docker.outputs.digest }}

    - name: Generate container image SBOM (syft)
      if: github.event_name == 'release'
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        image: ghcr.io/sipcapture/rtcagent@${{ steps.docker.outputs.digest }}
        format: spdx-json
        output-file: rtcagent-image.spdx.json
        registry-username: ${{ github.actor }}
        registry-password: ${{ secrets.GITHUB_TOKEN }}
        upload-artifact: false
        upload-release-assets: false

    - name: Scan container image (Trivy)
      if: github.event_name == 'release'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ghcr.io/sipcapture/rtcagent@${{ steps.docker.outputs.digest }}
        format: sarif
        output: trivy-image.sarif
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "0"

    - name: Upload Trivy results to code scanning
      if: github.event_name == 'release'
      uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
      with:
        sarif_file: trivy-image.sarif
        category: trivy-container

    - name: Attest container image SBOM (cosign)
      if: github.event_name == 'release'
      run: |
        cosign attest --yes \
          --predicate rtcagent-image.spdx.json \
          --type spdxjson \
          "ghcr.io/sipcapture/rtcagent@${{ steps.docker.outputs.digest }}"

    - name: Attach container SBOM and scan report to the release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.ref_name }}" \
          rtcagent-image.spdx.json trivy-image.sarif --clobber