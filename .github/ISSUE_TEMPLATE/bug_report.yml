name: Bug report
description: Report a problem with rtcagent
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. rtcagent captures live
        traffic, so environment and kernel details matter a lot — please fill in
        as much as you can.
  - type: input
    id: version
    attributes:
      label: rtcagent version
      description: Output of `rtcagent --version`, or the release tag.
      placeholder: "linux_amd64:0.0.10:[CORE]"
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel and distribution
      description: Output of `uname -r` and the distribution/version.
      placeholder: "5.15.0-125-generic (Ubuntu 22.04)"
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Captured application
      options:
        - kamailio
        - opensips
        - freeswitch
        - rtpengine
        - monitor
        - other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command line
      description: The exact rtcagent invocation (redact addresses/keys if needed).
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Full logs, `dmesg`/verifier output, or a HEP capture.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest release.
          required: false