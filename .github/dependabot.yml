version: 2
updates:
  # Keep Go modules up to date, grouped to reduce PR noise.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns:
          - "*"
    ignore:
      # github.com/adubovikov/ebpfmanager v0.4.7 (the newest release) does not
      # compile against cilium/ebpf v0.13.0+ (spec.Freeze, RewriteConstants and
      # RewriteMaps were removed), so updating it breaks `go build ./...`.
      # Re-enable once ebpfmanager supports a newer cilium/ebpf.
      - dependency-name: "github.com/cilium/ebpf"

  # Keep GitHub Actions pinned up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"